# =============================================================================
# E1 Experiment: Visual Engrams for CVS Classification
# =============================================================================
#
# Hypothesis: Explicit GB+Tool segmentation masks as additional input channels
#             help SwinCVS assess C1 (hepatocystic triangle clearance) criteria.
#
# Architecture Change:
#   Input: RGB (3ch) + GB mask (1ch) + Tool mask (1ch) = 5 channels
#   - Channels 0-2: RGB image (ImageNet normalized)
#   - Channel 3: Gallbladder mask (binary, normalized)
#   - Channel 4: Tool mask (binary, normalized)
#
# Reference: Thread 0 findings - C1 is an assessment problem, not detection.
#            Providing spatial priors should improve assessment accuracy.
# =============================================================================

# GENERAL PARAMS
EXPERIMENT_NAME: 'E1_SwinCVS_Engram_v1'
SEED: 5
DATASET_DIR: 'C:\Users\sufia\Documents\Uni\Masters\DISSERTATION\sam2_finetune'  # endoscapes folder is here

# =============================================================================
# ENGRAM CONFIGURATION (NEW for E1)
# =============================================================================
# Visual engrams provide explicit segmentation masks as additional input channels.
# These masks are generated by the coarse segmentation model (V2) trained on
# 3 classes: background, gallbladder, tool.
ENGRAM:
  ENABLED: True
  # Path to trained coarse segmentation model (relative to project root)
  CHECKPOINT_PATH: 'checkpoints/coarse_segmentation_v2/run_20260120_234049/best_model.pt'
  # Which mask channels to include
  GB_CHANNEL: True       # Include gallbladder mask as channel 3
  TOOL_CHANNEL: True     # Include tool mask as channel 4
  # Confidence threshold for coarse model predictions
  # Pixels below this threshold are set to 0 in the mask
  MASK_THRESHOLD: 0.5    # Use 0.5 for binary argmax, higher for confidence filtering
  # Normalization for mask channels
  # Binary masks [0, 1] centered at 0.5 with std 0.5 -> normalized to [-1, 1]
  # This matches the scale of ImageNet-normalized RGB channels
  MASK_MEAN: [0.5, 0.5]  # [GB_mean, Tool_mean]
  MASK_STD: [0.5, 0.5]   # [GB_std, Tool_std]
  # Coarse model input/output resolution
  COARSE_INPUT_SIZE: 512   # Coarse model expects 512x512
  # Cache masks to avoid recomputing during training (recommended)
  CACHE_MASKS: True
  CACHE_DIR: null  # null = auto-generate in dataset folder
  # RGB normalization mode:
  # - False (default, RECOMMENDED): Use ImageNet normalization for proper pretrained weight usage
  # - True: Rescale to [0,1] after transforms (matches original SwinCVS but suboptimal)
  NORMALIZE_01: False

# =============================================================================
# SWINCVS MODEL PARAMS
# =============================================================================
MODEL:
  LSTM: True
  LSTM_PARAMS:
    NUM_LAYERS: 2
    HIDDEN_SIZE: 256
  E2E: True              # End-to-end training (backbone NOT frozen)
  MULTICLASSIFIER: True  # Use multi-scale classifier (requires E2E=True)
  INFERENCE: False
  INFERENCE_WEIGHTS: 'E1_SwinCVS_Engram_v1_bestMAP.pt'

# =============================================================================
# TRAINING PARAMS
# =============================================================================
TRAIN:
  EPOCHS: 8
  LIMIT_DATA_FRACTION: 1  # 1 = 100% of data
  TRANSFORMS:
    # RGB normalization (ImageNet statistics)
    ENDOSCAPES_MEAN: [0.485, 0.456, 0.406]
    ENDOSCAPES_STD: [0.229, 0.224, 0.225]
    CENTER_CROP: 480
  BATCH_SIZE: 1  # Reduced from 4 due to GPU memory (12GB) with 88M param model + 5-frame LSTM
  OPTIMIZER:
    NAME: 'adamw'
    EPS: 1.0e-08
    BETAS: [0.9, 0.999]
    WEIGHT_DECAY: 0.02
    ENCODER_LR: 0.00001    # Lower LR for pretrained backbone
    CLASSIFIER_LR: 0.001   # Higher LR for classifier head
  # Class weights for imbalanced CVS criteria
  # [C1_weight, C2_weight, C3_weight]
  CLASS_WEIGHTS: [3.19852941, 4.46153846, 2.79518072]
  WARMUP_EPOCHS: 4
  WARMUP_LR: 0.001
  BASE_LR: 0.001
  MIN_LR: 0.0000001
  # Multi-classifier loss weighting (alpha * main_loss + (1-alpha) * aux_loss)
  MULTICLASSIFIER_ALPHA: 0.8
  SAVE_WEIGHTS: True
  CHECKPOINT_PATH: null  # null = default to weights dir
  LR_SCHEDULER:
    NAME: 'cosine'
    WARMUP_PREFIX: False
  CLIP_GRAD: 5
  ACCUMULATION_STEPS: 4  # Effective batch size = BATCH_SIZE * ACCUMULATION_STEPS = 4

# =============================================================================
# SWINV2 BACKBONE PARAMS
# =============================================================================
BACKBONE:
  PRETRAINED: 'swinv2_base_patch4_window12to24_192to384_22kto1k_ft.pth'
  DROP_PATH_RATE: 0.2
  DROP_RATE: 0.0
  NUM_CLASSES: 1000
  SWINV2:
    PATCH_SIZE: 4
    # CHANGED for E1: 5 input channels (RGB + GB mask + Tool mask)
    # Original: IN_CHANS: 3
    IN_CHANS: 5
    EMBED_DIM: 128
    DEPTHS: [2, 2, 18, 2]
    NUM_HEADS: [4, 8, 16, 32]
    WINDOW_SIZE: 24
    PRETRAINED_WINDOW_SIZES: [12, 12, 12, 6]
    MLP_RATIO: 4
    QKV_BIAS: True
    APE: False
    PATCH_NORM: True
  USE_CHECKPOINT: True  # Gradient checkpointing to save memory

# =============================================================================
# EVALUATION PARAMS (for tracking experiment progress)
# =============================================================================
EVAL:
  # Metrics to track
  PRIMARY_METRIC: 'mAP'
  TRACK_PER_CLASS: True  # Track C1, C2, C3 separately
  # Baseline comparison (from SwinCVS_E2E_MC_IMNP_sd5 16-epoch run)
  BASELINE_MAP:
    C1: 0.3639
    C2: 0.3070
    C3: 0.4175
    OVERALL: 0.3628
