# =============================================================================
# E1 Experiment: Visual Engrams for CVS Classification
# CLUSTER VERSION - UCL CS Cluster Paths
# =============================================================================
#
# This is the cluster-specific configuration for E1.
# Key differences from local config:
#   - DATASET_DIR points to cluster data location
#   - ENGRAM.CHECKPOINT_PATH uses absolute cluster path
#
# Usage:
#   python scripts/swincvs_engram/SwinCVS_engram.py \
#       --config_path scripts/swincvs_engram/cluster/SwinCVS_engram_config_cluster.yaml
# =============================================================================

# GENERAL PARAMS
EXPERIMENT_NAME: 'E1_SwinCVS_Engram_v1'
SEED: 5
# CLUSTER PATH: Endoscapes dataset location
DATASET_DIR: '/SAN/medic/surgical_vision_sam2/data'

# =============================================================================
# ENGRAM CONFIGURATION (NEW for E1)
# =============================================================================
ENGRAM:
  ENABLED: True
  # CLUSTER PATH: Coarse segmentation model checkpoint
  CHECKPOINT_PATH: '/SAN/medic/surgical_vision_sam2/sam2_finetune/checkpoints/coarse_segmentation_v2/run_20260120_234049/best_model.pt'
  # Which mask channels to include
  GB_CHANNEL: True       # Include gallbladder mask as channel 3
  TOOL_CHANNEL: True     # Include tool mask as channel 4
  # Confidence threshold for coarse model predictions
  MASK_THRESHOLD: 0.5
  # Normalization for mask channels (binary [0,1] -> [-1,1])
  MASK_MEAN: [0.5, 0.5]  # [GB_mean, Tool_mean]
  MASK_STD: [0.5, 0.5]   # [GB_std, Tool_std]
  # Coarse model input/output resolution
  COARSE_INPUT_SIZE: 512
  # Cache masks to disk (speeds up subsequent epochs)
  CACHE_MASKS: True
  CACHE_DIR: null  # null = auto-generate in dataset folder

# =============================================================================
# SWINCVS MODEL PARAMS
# =============================================================================
MODEL:
  LSTM: True
  LSTM_PARAMS:
    NUM_LAYERS: 2
    HIDDEN_SIZE: 256
  E2E: True              # End-to-end training (backbone NOT frozen)
  MULTICLASSIFIER: True  # Use multi-scale classifier
  INFERENCE: False
  INFERENCE_WEIGHTS: 'E1_SwinCVS_Engram_v1_bestMAP.pt'

# =============================================================================
# TRAINING PARAMS
# =============================================================================
TRAIN:
  EPOCHS: 8
  LIMIT_DATA_FRACTION: 1  # 1 = 100% of data
  TRANSFORMS:
    # RGB normalization (ImageNet statistics)
    ENDOSCAPES_MEAN: [0.485, 0.456, 0.406]
    ENDOSCAPES_STD: [0.229, 0.224, 0.225]
    CENTER_CROP: 480
  BATCH_SIZE: 4
  OPTIMIZER:
    NAME: 'adamw'
    EPS: 1.0e-08
    BETAS: [0.9, 0.999]
    WEIGHT_DECAY: 0.02
    ENCODER_LR: 0.00001    # Lower LR for pretrained backbone
    CLASSIFIER_LR: 0.001   # Higher LR for classifier head
  # Class weights for imbalanced CVS criteria
  CLASS_WEIGHTS: [3.19852941, 4.46153846, 2.79518072]
  WARMUP_EPOCHS: 4
  WARMUP_LR: 0.001
  BASE_LR: 0.001
  MIN_LR: 0.0000001
  MULTICLASSIFIER_ALPHA: 0.8
  SAVE_WEIGHTS: True
  CHECKPOINT_PATH: null
  LR_SCHEDULER:
    NAME: 'cosine'
    WARMUP_PREFIX: False
  CLIP_GRAD: 5
  ACCUMULATION_STEPS: 1

# =============================================================================
# SWINV2 BACKBONE PARAMS
# =============================================================================
BACKBONE:
  # SwinV2 pretrained weights (downloaded by setup_env.sh)
  PRETRAINED: 'swinv2_base_patch4_window12to24_192to384_22kto1k_ft.pth'
  DROP_PATH_RATE: 0.2
  DROP_RATE: 0.0
  NUM_CLASSES: 1000
  SWINV2:
    PATCH_SIZE: 4
    # E1: 5 input channels (RGB + GB mask + Tool mask)
    IN_CHANS: 5
    EMBED_DIM: 128
    DEPTHS: [2, 2, 18, 2]
    NUM_HEADS: [4, 8, 16, 32]
    WINDOW_SIZE: 24
    PRETRAINED_WINDOW_SIZES: [12, 12, 12, 6]
    MLP_RATIO: 4
    QKV_BIAS: True
    APE: False
    PATCH_NORM: True
  USE_CHECKPOINT: False

# =============================================================================
# EVALUATION PARAMS
# =============================================================================
EVAL:
  PRIMARY_METRIC: 'mAP'
  TRACK_PER_CLASS: True
  BASELINE_MAP:
    C1: null
    C2: null
    C3: null
    OVERALL: null
